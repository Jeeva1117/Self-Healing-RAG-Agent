name: CI Quality & Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-ci:
    name: Backend Lint & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check backend/app backend/tests --config pyproject.toml

      - name: Run Pytest test suite
        env:
          JWT_SECRET: ci-test-secret-key-32-chars-long-minimum!
          JWT_ALGORITHM: HS256
          ALGORITHM: HS256
          DEMO_LOGIN_ENABLED: "true"
          EMBEDDING_PROVIDER: "fastembed"
          EMBEDDING_MODEL: "BAAI/bge-small-en-v1.5"
          EMBEDDING_DIMENSION: 384
          LLM_PROVIDER: "mock"
        run: |
          pytest -o pythonpath=backend backend/tests

  frontend-ci:
    name: Frontend Vitest & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest unit tests
        run: |
          cd frontend
          npm run test

      - name: TypeScript type-check and production build
        run: |
          cd frontend
          npm run build
